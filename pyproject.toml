[project]
name = "occupancy-graph-service"
version = "0.1.0"
description = "Typed HTTP data service over the partner records corpus, plus a guarded SQL hatch."
requires-python = ">=3.14"
dependencies = [
    "starlette>=1.3",
    "uvicorn>=0.49.0",
    "asyncpg>=0.30.0",
    # PostgreSQL's own parser (libpg_query), not a reimplementation of it. The
    # SQL hatch's write guard is built on the parse tree; see sql_guard.py for
    # why a hand-written lexer was the wrong shape for that control.
    "pglast>=8.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4",
    "httpx>=0.28",
]

[project.scripts]
occupancy-graph-serve = "occupancy_graph.service.serve:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." is required so `clone` (and its submodules) can be imported: unlike
# `occupancy_graph`, which lands on the path via `src` below (mirroring its
# editable install), `clone` is not an installed package. Without ".", the
# suite only passes under `python -m pytest` (which prepends CWD to sys.path
# itself) and dies under bare `pytest` with "No module named 'clone.loader'".
pythonpath = [".", "src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: hits the real partner DB; requires PARTNER_DSN and network"]
# A hang that produces NO output is the worst CI failure mode there is: two
# separate sessions stalled for 10 and 15 minutes with a blank terminal before
# being killed, and neither left a traceback to work from. This converts that
# into a loud, located failure.
#
# The ceiling applies to EACH phase (setup, call, teardown) of EACH test, not to
# the session. Measured slowest phase: 6.3s -- the session-scoped fixture_db
# setup (`docker compose up --wait` + psql load of schema.sql/seed.sql). Every
# other phase in the suite is under 0.8s and the whole run is ~19s. 120s is ~19x
# the slowest real phase, which leaves room for a cold CI runner that still has
# to pull the postgres image, while capping a wedged run at two minutes.
timeout = 120
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
