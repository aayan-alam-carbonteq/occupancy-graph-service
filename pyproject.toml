[project]
name = "occupancy-graph-service"
version = "0.1.0"
description = "Typed HTTP data service over the partner records corpus, plus a guarded SQL hatch."
requires-python = ">=3.14"
dependencies = [
    "starlette>=1.3",
    "uvicorn>=0.49.0",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[project.scripts]
occupancy-graph-serve = "occupancy_graph.service.serve:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: hits the real partner DB; requires PARTNER_DSN and network"]
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
