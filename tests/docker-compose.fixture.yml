services:
  graph-fixture-db:
    image: postgres:17
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
      POSTGRES_DB: graph_fixture
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph -d graph_fixture"]
      interval: 2s
      timeout: 3s
      retries: 30
